name: updatis

services:
  metadata-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: updatis_bootstrap
      POSTGRES_DB: updatis_metadata
      POSTGRES_PASSWORD_FILE: /run/secrets/metadata_bootstrap_password
    secrets: [metadata_bootstrap_password, metadata_migration_password, metadata_runtime_password]
    volumes:
      - metadata-data:/var/lib/postgresql
      - ./postgres/init-metadata.sh:/docker-entrypoint-initdb.d/10-metadata.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U updatis_bootstrap -d updatis_metadata"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [metadata]

  source-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: source_bootstrap
      POSTGRES_DB: example_source
      POSTGRES_PASSWORD_FILE: /run/secrets/source_bootstrap_password
    secrets: [source_bootstrap_password, source_runtime_password]
    volumes:
      - source-data:/var/lib/postgresql
      - ./postgres/init-source.sh:/docker-entrypoint-initdb.d/10-source.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_bootstrap -d example_source"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [source]

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks: [transport]

  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: updatis-connect
      CONFIG_STORAGE_TOPIC: updatis_connect_configs
      OFFSET_STORAGE_TOPIC: updatis_connect_offsets
      STATUS_STORAGE_TOPIC: updatis_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connector-plugins >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks: [source, transport]

  migrate:
    build: {context: .., dockerfile: Dockerfile}
    profiles: [tools]
    command: ["updatis.db.migrate", "--config", "/etc/updatis/runtime.json"]
    environment: {UPDATIS_RUNTIME_CONFIG: /etc/updatis/runtime.json}
    configs:
      - {source: migration_config, target: /etc/updatis/runtime.json}
    secrets: [metadata_migration_password]
    depends_on:
      metadata-db: {condition: service_healthy}
    networks: [metadata]

  api:
    build: {context: .., dockerfile: Dockerfile}
    command: ["updatis.api"]
    environment: {UPDATIS_RUNTIME_CONFIG: /etc/updatis/runtime.json}
    configs:
      - {source: runtime_config, target: /etc/updatis/runtime.json}
    secrets: [metadata_runtime_password]
    depends_on:
      metadata-db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [metadata, api-edge]

  worker:
    build: {context: .., dockerfile: Dockerfile}
    command: ["updatis.worker"]
    environment: {UPDATIS_RUNTIME_CONFIG: /etc/updatis/runtime.json}
    configs:
      - {source: runtime_config, target: /etc/updatis/runtime.json}
    secrets: [metadata_runtime_password]
    depends_on:
      metadata-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [metadata]

configs:
  runtime_config: {file: ./config/runtime.example.json}
  migration_config: {file: ./config/migration.example.json}

secrets:
  metadata_bootstrap_password: {file: ./secrets/metadata_bootstrap_password}
  metadata_migration_password: {file: ./secrets/metadata_migration_password}
  metadata_runtime_password: {file: ./secrets/metadata_runtime_password}
  source_bootstrap_password: {file: ./secrets/source_bootstrap_password}
  source_runtime_password: {file: ./secrets/source_runtime_password}

volumes:
  metadata-data: {}
  source-data: {}
  kafka-data: {}

networks:
  metadata: {internal: true}
  source: {internal: true}
  transport: {internal: true}
  api-edge: {}
