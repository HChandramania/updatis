name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify imports and runtime
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 13); import app, kafka"
          python -m pip check
      - name: Run Foundation suite
        run: python -m pytest

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
      - name: Validate isolated candidate containers
        run: python tests/compatibility/verify.py
